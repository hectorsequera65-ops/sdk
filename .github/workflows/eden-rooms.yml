name: Build EdenRooms ELF

on:
  workflow_dispatch:
  push:
    paths:
      - 'samples/eden_rooms/**'
      - '.github/workflows/eden-rooms.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK fork
        uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget make
      - name: Install SDK
        run: |
          sudo make DESTDIR=/opt/ps5-payload-sdk install
      - name: Compile Eden Rooms launcher
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make -C samples/eden_rooms
          file samples/eden_rooms/EdenRooms.elf
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: EdenRooms-PS5-ELF
          path: samples/eden_rooms/EdenRooms.elf
          if-no-files-found: error
